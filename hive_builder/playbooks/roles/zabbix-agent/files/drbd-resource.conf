UserParameter=user.discovery.drbd-resource,if command -v drbdadm >/dev/null 2>&1; then drbdadm status; fi |awk 'BEGIN{D="";printf"{\"data\":["}END{printf"]}"}/^[a-z_-]* role:/{printf "%s{\"{#RESOURCE_NAME}\": \"%s\"}",D,$1;D=","}'
UserParameter=drbd-resource[*],drbdadm status $1 | awk -F ':' '/^ *disk:/{print $$2}'
