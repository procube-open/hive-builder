---
- name: copy selinux module for zabbix-agent
  copy:
    src: hive.te
    dest: /root/hive.te
  register: result_hive_zabbix_agent_policy
  when: hive_safe_selinux != 'disabled'
- name: install selinux module for zabbix-agent
  make:
    chdir: /root
    target: load
    file: /usr/share/selinux/devel/Makefile
  become: true
  when: hive_safe_selinux != 'disabled'

- name: find DRBD release for the selected boot kernel
  hive_drbd_release:
    kernel: "{{ hive_safe_expected_kernel | default(ansible_kernel) | trim }}"
  register: hive_safe_drbd_release
  when: hive_drbd_download_url is not defined
- name: select DRBD archive
  set_fact:
    hive_safe_drbd_url: "{{ hive_drbd_download_url if hive_drbd_download_url is defined else hive_safe_drbd_release.download_url }}"
- name: select isolated DRBD extraction directory
  set_fact:
    hive_safe_drbd_dir: "/root/drbd/{{ hive_safe_drbd_url | hash('sha256') }}"
- name: create DRBD extraction directory
  file:
    path: "{{ hive_safe_drbd_dir }}"
    state: directory
    mode: '0700'
- name: download drbd rpm tarball
  get_url:
    url: "{{ hive_safe_drbd_url }}"
    dest: "{{ hive_safe_drbd_dir }}/archive.tar.gz"
    checksum: "{{ hive_safe_drbd_release.checksum | default(omit) }}"
    timeout: 120
- name: extract drbd rpm files
  unarchive:
    src: "{{ hive_safe_drbd_dir }}/archive.tar.gz"
    remote_src: yes
    dest: "{{ hive_safe_drbd_dir }}"
- name: gather rpm file list
  find:
    paths: "{{ hive_safe_drbd_dir }}/RPMS"
    patterns: '*.rpm'
    recurse: true
  register: hive_safe_rpms
- name: require DRBD RPMs in the selected archive
  assert:
    that: hive_safe_rpms.matched > 0
    fail_msg: "No DRBD RPMs found in {{ hive_safe_drbd_url }}"
- name: install packages
  yum:
    state: present
    name: "{{ hive_safe_rpms.files | map(attribute='path') | list }}"
    disable_gpg_check: true
  register: drbd_install
- name: install LVM tools
  yum:
    state: present
    name: lvm2
- name: change usage count setting
  lineinfile:
    regexp: "usage-count .*;"
    line: "        usage-count no;"
    path: /etc/drbd.d/global_common.conf
    state: present
- name: setup minor-count configuration
  lineinfile:
    insertafter: "# minor-count"
    line: "        minor-count 128;"
    path: /etc/drbd.d/global_common.conf
    state: present

- include_tasks: vg.yml
  loop: "{{ hive_safe_mirrored_disk_devices }}"
  loop_control:
    loop_var: disk
  when: not (hive_no_mirrored_devices | default(False))

- name: set net.ipv4.tcp_rmem
  sysctl:
    name: net.ipv4.tcp_rmem
    value: "131072 1048576 16777216"

- name: set net.ipv4.tcp_wmem
  sysctl:
    name: net.ipv4.tcp_wmem
    value: "131072 1048576 16777216"

- import_tasks: iptables.yml
  vars:
    hive_safe_iptables_name: drbd
    hive_safe_iptables_dports:
      - 7000:7999
    hive_safe_iptables_protocol: tcp

- name: "install drbd resource service template"
  copy:
    src: drbd-resource@.service
    dest: /usr/lib/systemd/system/
- name: "install waiting drbd device tool"
  copy:
    src: waitdevice
    dest: /usr/bin/
    mode: 0755
