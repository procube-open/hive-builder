---
- name: "setup zabbix - create dir"
  file:
    path: "{{ hive_home_dir }}/zabbix"
    state: directory
    mode: 0755

- name: "install zabbix docker-compose.yml"
  template:
    src: zabbix.yml.j2
    dest: "{{ hive_home_dir }}/zabbix/docker-compose.yml"
    mode: 0755

- vars:
    ansible_python_interpreter: "{{ hive_home_dir }}/docker/bin/python"
  module_defaults:
    hive_zabbix:
      server_url: "http://localhost:{{ hive_safe_zabbix_port }}"
      login_user: Admin
      login_password: zabbix
  block:
  - name: get ip list of repository
    when: hive_shared_repository is defined
    include_vars:
      file: "{{ hive_shared_repository_path }}/hosts.yml"
      name: loaded_ip_addresses
  - name: derive hive names on shared repository
    when: hive_shared_repository is defined
    set_fact:
      hive_safe_zabbix_hive_names: >-
        {{ ((loaded_ip_addresses.keys() | select('search', '\\.') | map('regex_replace', '^.*\\.', '') | list) + [hive_name]) | unique | sort }}
  - name: login to external repository
    docker_login:
      registry: "{{ item.repository | default(omit) }}"
      username: "{{ item.login_user }}"
      password: "{{ item.password }}"
    loop: "{{ hive_ext_repositories }}"
    when: hive_ext_repositories is defined
    no_log: True
  - name: compose up zabbix container
    become: False
    community.docker.docker_compose_v2:
      project_src: "{{ hive_home_dir }}/zabbix"

  - name: wait for Zabbix database initialization and upgrade
    uri:
      url: "http://localhost:{{ hive_safe_zabbix_port }}/api_jsonrpc.php"
      method: POST
      body_format: json
      body:
        jsonrpc: "2.0"
        id: 1
        method: apiinfo.version
        params: {}
    register: hive_safe_zabbix_ready
    until: (hive_safe_zabbix_ready.json.result | default('')).startswith('8.0.')
    retries: 60
    delay: 10
  - name: remove default Zabbix Server
    hive_zabbix:
      resource: host
      host_name: Zabbix server
      host_groups:
      - Zabbix servers
      state: absent
    until: not zabbix_api_result.failed
    retries: 20
    delay: 10
    register: zabbix_api_result
  - name: Create Hive, Repository group
    hive_zabbix:
      resource: hostgroup
      state: present
      host_groups:
        - Hives
        - Repository server
        - Linux servers
  - name: Configure macros on the Linux by Zabbix agent
    hive_zabbix:
      resource: template_macro
      template_name: "{{ hive_zabbix_template | default('Linux by Zabbix agent') }}"
      macro_name: '{$VFS.FS.FSNAME.NOT_MATCHES}'
      macro_value: ^(/dev|/sys|/run|/proc|.+/shm$|/var/lib/docker)
  - name: upload generated Zabbix templates
    hive_zabbix:
      resource: template
      template_xml: "{{ lookup('template', item) }}"
    loop:
      - hive-repository-server.xml.j2
      - Template_Docker_Swarm_Services.xml.j2
    vars:
      hive_names: "{{ hive_safe_zabbix_hive_names | default(hive_zabbix_hive_names | default([hive_name])) }}"
  - name: upload templates
    hive_zabbix:
      resource: template
      template_xml: "{{ lookup('file', item) }}"
    loop:
      - hive-server.xml
      - hive-server-selinux.xml
      - Template_App_systemd_Services.xml

  - name: register hive hosts to zabbix
    hive_zabbix:
      resource: host
      host_name: "{% if item in groups['repository'] and hive_shared_repository is defined %}shared-repository{% else %}{{ item }}{% endif %}"
      host_groups:
      - Linux servers
      link_templates: >-
        {%- set templates = [hive_zabbix_template | default('Linux by Zabbix agent')] -%}
        {%- if item in groups['repository'] -%}
          {%- set _ = templates.append('Hive Repository Server') -%}
          {%- set _ = templates.append('Docker Swarm Services') -%}
        {%- endif -%}
        {%- if item in groups['hives'] -%}
          {%- set _ = templates.append('Hive Server') -%}
          {%- set _ = templates.append('SystemD service monitoring template') -%}
          {%- if hive_safe_selinux != 'disabled' -%}
            {%- set _ = templates.append('Hive Server SELinux') -%}
          {%- endif -%}
        {%- endif -%}
        {{ templates }}
      interfaces:
        - type: 1
          main: 1
          useip: 1
          ip: "{% if item in groups['repository'] and hive_shared_repository is defined %}{{ hive_safe_zabbix_subnet | ipaddr(1) | ipaddr('address') }}{% elif hive_shared_repository is defined %}{{ loaded_ip_addresses[item] }}{% else %}{{ hostvars[item].hive_private_ip }}{% endif %}"
          dns: ""
          port: 10050
      state: present
    loop: "{{ groups['servers'] | intersect(groups[hive_stage]) | list }}"
  - name: Ensure group zabbix exists
    become: True
    group:
      name: zabbix
      state: present
  - name: "set permission for /var/log/messages"
    become: True
    file:
      path: /var/log/messages
      mode: "0640"
      owner: root
      group: zabbix
  - name: "set logrotate to permission for zabbix"
    become: True
    user:
      name: "{{ hive_safe_admin }}"
      append: True
      groups: zabbix
    when: hive_safe_admin is defined
