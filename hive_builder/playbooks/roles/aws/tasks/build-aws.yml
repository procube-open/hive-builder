---
- name: create VPC
  ec2_vpc_net:
    name: "{{ hive_safe_vpc_name }}"
    cidr_block: "{{ hive_cidr }}"
    region: "{{ hive_region }}"
    tags:
      Project: "{{ hive_name }}"
    state: present
  register: hive_safe_aws_vpc

- name: remember VPC for Instance Connect
  set_fact:
    hive_safe_aws_vpc_id: "{{ hive_safe_aws_vpc.vpc.id }}"

- name: setup internet gateway for VPC
  ec2_vpc_igw:
    vpc_id: "{{ hive_safe_aws_vpc.vpc.id }}"
    region: "{{ hive_region }}"
    state: present
    tags:
      Name: "gateway for {{ hive_safe_vpc_name }}"
      Project: "{{ hive_name }}"
  register: hive_safe_igw

- name: prepare Instance Connect security group
  include_tasks: eice-security-group.yml

- name: setup subnet for VPC
  ec2_vpc_subnet:
    state: present
    region: "{{ hive_region }}"
    az: "{{ item.available_zone }}"
    vpc_id: "{{ hive_safe_aws_vpc.vpc.id }}"
    cidr: "{{ item.cidr }}"
    resource_tags:
      Name: "{{ item.name }}"
      Project: "{{ hive_name }}"
  loop: "{{ hive_subnets }}"
  register: hive_safe_subnets_info

- name: build Instance Connect Endpoint
  include_tasks: build-eice.yml

- name: initialize security group rules
  set_fact:
    hive_safe_inbound_rules: "{{ hive_ec2_group_rules | default([{'proto': 'all', 'group_name': 'default'}]) }}"

- name: add default TCP rules
  set_fact:
    hive_safe_inbound_rules: "{{ hive_safe_inbound_rules + [{'proto': 'tcp', 'to_port': item, 'from_port': item, 'cidr_ip': '0.0.0.0/0'}] }}"
  loop: "{{ hive_published_ports_tcp + hive_safe_shared_repository_ports }}"
  when:
    - hive_ec2_group_rules is not defined
    - item | int != hive_safe_sshd_port | int

- name: add default UDP rules
  set_fact:
    hive_safe_inbound_rules: "{{ hive_safe_inbound_rules + [{'proto': 'udp', 'to_port': item, 'from_port': item, 'cidr_ip': '0.0.0.0/0'}] }}"
  loop: "{{ hive_published_ports_udp }}"
  when: hive_ec2_group_rules is not defined

- name: allow SSH from Instance Connect Endpoint
  set_fact:
    hive_safe_inbound_rules: "{{ hive_safe_inbound_rules + [{'proto': 'tcp', 'from_port': hive_safe_sshd_port | int, 'to_port': hive_safe_sshd_port | int, 'group_id': hive_safe_eice_group.group_id}] }}"

- name: set for published port and name tag to default security group for VPC
  ec2_group:
    state: present
    name: default
    tags:
      Name: "group-{{ hive_safe_vpc_name }}"
      Project: "{{ hive_name }}"
    vpc_id: "{{hive_safe_aws_vpc.vpc.id }}"
    description: "default VPC security group"
    region: "{{ hive_region }}"
    rules: "{{ hive_safe_inbound_rules }}"
  register: hive_safe_group

- name: gather default route table facts
  ec2_vpc_route_table_info:
    region: "{{ hive_region }}"
    filters:
      vpc-id: "{{ hive_safe_aws_vpc.vpc.id }}"
  register: hive_safe_rtb

- name: set up public subnet route table
  ec2_vpc_route_table:
    vpc_id: "{{ hive_safe_aws_vpc.vpc.id }}"
    route_table_id: "{{ hive_safe_rtb.route_tables[0].id }}"
    region: "{{ hive_region }}"
    lookup: id
    tags:
      Name: Public for subnet
      Project: "{{ hive_name }}"
    subnets: "{{ hive_safe_subnets_info.results | selectattr('item.value.gateway', 'defined') | map(attribute='subnet.id') | list }}"
    routes:
      - dest: 0.0.0.0/0
        gateway_id: "{{ hive_safe_igw.gateway_id }}"

- name: create key pair using key_material obtained using 'file' lookup plugin
  ec2_key:
    name: "{{ hive_aws_key_name | default('hive-bulder-' + hive_name) }}"
    region: "{{ hive_region }}"
    key_material: "{{ lookup('file', hive_safe_public_key_path) }}"

- name: create instances
  include_tasks: create_instance.yml
  loop: "{{ hive_safe_hosts }}"
  loop_control:
    loop_var: aws_host

- name: initialize EFS targets
  set_fact:
    hive_safe_efs_targets: []
  when: (groups['nfs_volumes'] | intersect(groups[hive_stage]) | length) > 0

- name: collect EFS targets
  set_fact:
    hive_safe_efs_targets: "{{ hive_safe_efs_targets + [{'subnet_id': item.subnet.id}] }}"
  loop: "{{ hive_safe_subnets_info.results }}"
  when: (groups['nfs_volumes'] | intersect(groups[hive_stage]) | length) > 0

- name: create EFS file system
  efs:
    state: present
    name: "efs-{{ hive_name }}"
    region: "{{ hive_region }}"
    tags:
      Name: "efs-{{ hive_name }}"
      Project: "{{ hive_name }}"
    targets: "{{ hive_safe_efs_targets | default([]) }}"
    encrypt: "{{ hive_mirrored_disk_encrypted | default(False) }}"
    kms_key_id: "{{ (hive_kms_key_id | default(omit)) if (hive_mirrored_disk_encrypted | default(False)) else omit }}"
  when: (groups['nfs_volumes'] | intersect(groups[hive_stage]) | length) > 0
