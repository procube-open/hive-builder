[tool.poetry]
name = "hive-builder"
version = "3.10.0"
description = "Building docker swarm environment"
authors = ["Mitsuru Nakakawaj <mitsuru@procube.jp>"]
license = "MIT"
readme = "README.md"
packages = [{include = "hive_builder"}]

[tool.poetry.dependencies]
python = "^3.11"
ansible-core = [
  {version = ">=2.19.15,<3", python = ">=3.11,<3.12"},
  {version = ">=2.21.6,<3", python = ">=3.12,<3.13"},
  {version = ">=2.22.0,<3", python = ">=3.13"},
]
configparser = ">=7.2.0,<8"
lockfile = "^0.12.2"
python-vagrant = "^1.0.0"
requests = ">=2.32.5,<3"
google-auth = ">=2.50.0,<3"
boto = "^2.49.0"
boto3 = ">=1.42.97,<2"
netaddr = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
hive = "hive_builder.hive:main"
